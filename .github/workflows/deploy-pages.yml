name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Security repository guard
        run: node scripts/security-guard.js

      - name: Validate JavaScript syntax
        run: |
          find . -type f -name '*.js' -not -path './.git/*' -print0 | sort -z | xargs -0 -n1 node --check

      - name: Run poker engine tests
        run: node test-engine.js

      - name: Audit quiz options
        run: node test-quiz-quality.js

      - name: Audit English translation
        run: node test-i18n.js

      - name: Protect Academy performance
        run: node test-performance.js

      - name: Protect Academy typography
        run: node test-typography.js

      - name: Validate Play release UI
        run: node test-ui-release.js

      - name: Validate Android native shell contract
        run: node android/test-shell-contract.js

      - name: Protect Academy premium frontend
        run: node test-academy-premium.js

      - name: Validate web manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8')); console.log('manifest.webmanifest OK')"

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
