name: Import approved StackUp Academy snapshot

on:
  workflow_dispatch:
  pull_request:
    types: [opened]

permissions:
  contents: write

jobs:
  import:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.title == 'IMPORT_APPROVED_STACKUP_ACADEMY_SNAPSHOT')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Fetch approved source snapshot
        run: |
          set -euo pipefail
          git clone https://github.com/SkyareCom/stackup.holdem-academy.git /tmp/approved-source
          git -C /tmp/approved-source checkout 886ec061bfcb65b65bdb30a30adb9d75947ada9a
          test "$(git -C /tmp/approved-source rev-parse HEAD)" = "886ec061bfcb65b65bdb30a30adb9d75947ada9a"

      - name: Replace repository contents except workflows
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' --exclude='.github/workflows/' /tmp/approved-source/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "snapshot: approved StackUp Academy baseline 886ec061 (content)"
          git push origin HEAD:main
