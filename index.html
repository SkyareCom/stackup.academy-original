const D={fundamentos:{e:'ETAPA 01',t:'FUNDAMENTOS',d:'Aprenda primeiro como o poker funciona: mãos, mesa, apostas, regras e comportamento.',i:[['Ranking de mãos','Da mão mais forte à mais fraca.'],['Posições na mesa','BTN, blinds, posições iniciais, médias e finais.'],['Small Blind, Big Blind e Ante','Apostas obrigatórias e formação inicial do pote.'],['Streets','Pré-flop, flop, turn e river.'],['Sequência de apostas','Quem age primeiro, ordem das ações e fechamento da rodada.'],['Embaralhando as cartas','Preparação do baralho, corte e distribuição.'],['Misdeal','Quando uma distribuição é inválida e como proceder.'],['Funções do staff','Dealer, floor, direção e responsabilidades na mesa.'],['Terminologias básicas','Vocabulário essencial para entender mesa, ação e estratégia.'],['Perfis de jogadores','Tight, loose, agressivo, passivo e combinações comuns.'],['Cash game e tipos','Estrutura, blinds, buy-in, mesas e formatos de cash.'],['Torneio e tipos','Estruturas, fases, stacks, blinds e formatos de torneio.'],['Bons modos','Etiqueta, ritmo de jogo e respeito às regras da mesa.'],['Outras regras básicas','Showdown, muck, ação verbal, fichas e situações comuns.']]},modalidades:{e:'ETAPA 02',t:'MODALIDADES',d:'Depois da base, aprenda como as regras mudam entre as principais modalidades.',i:[["Texas Hold'em",'2 cartas na mão e 5 comunitárias.'],['Poker de 5 cartas','5-Card Draw e lógica de troca de cartas.'],['PLO 4 / PLO 5 / PLO 6','Omaha com quatro, cinco ou seis cartas fechadas.'],['5 & 7 Card Stud','Jogos Stud com cartas próprias abertas e fechadas.'],['Razz','Stud lowball: vence a melhor mão baixa.'],['H.O.R.S.E.','Rotação de Hold’em, Omaha Hi/Lo, Razz, Stud e Stud Hi/Lo.'],['Poker Caribenho','Modalidade de cassino jogada contra a casa.'],['Outras modalidades','Outras variantes para ampliar o repertório.']]},pratica:{e:'ETAPA 03',t:'PRÁTICA',d:'Fixe o aprendizado tomando decisões, resolvendo perguntas e treinando matemática.',i:[['Simulador','Treine mãos e regras d 'Cash game e tipos':[['ESTRUTURA','Fichas representam dinheiro; blinds costumam ser estáveis e há regras de buy-in.'],['FORMATOS','Full ring, 6-max, heads-up e diferentes limites de aposta.']],
'Torneio e tipos':[['ESTRUTURA','Blinds aumentam, jogadores podem ser eliminados e a premiação depende da colocação.'],['FORMATOS','MTT, Sit & Go, turbo, bounty, freezeout, re-entry e outros.']],
'Bons modos':[['ETIQUETA','Aja na sua vez, proteja suas cartas e mantenha fichas visíveis.'],['CONVIVÊNCIA','Respeite dealer e jogadores e não revele informação de mão ativa.']],

'PLO 4 / PLO 5 / PLO 6':[['REGRA 2 + 3','Use exatamente 2 cartas da mão e exatamente 3 cartas do board.'],['VARIAÇÕES','PLO4, PLO5 e PLO6 mudam a quantidade de cartas próprias recebidas.']],

function ranking(k,i,p=0){nav(true);let s=D[k];root.innerHTML=`<section class="screen"><div class="card lesson"><span class="badge">${s.e} · 01</span><h2>RANKING DE MÃOS</h2><p class="lead">Da combinação mais forte para a mais fraca. As cartas abaixo mostram um exemplo visual de cada mão.</p><div class="ranking">${R.map((r,n)=>`<div class="rrow"><div class="rhead"><span class="rpos">${String(n+1).padStart(2,'0')}</span><span class="rname">${r[0]}</span></div><div class="hand">${r[1].map(pc).join('')}</div><div class="rnote">${r[2]}</div></div>`).join('')}</div><div class="compare"><h3>COMO SABER QUEM VENCEU?</h3><div class="ci"><strong>MÃOS DIFERENTES</strong><p>Compare primeiro o tipo da mão. A combinação que aparece mais acima neste ranking vence. Exemplo: um Flush sempre vence uma Sequência.</p></div><div class="ci"><strong>MESMO TIPO DE MÃO</strong><p>Compare as cartas que formam a combinação, da maior para a menor. Se ainda houver empate, entram os kickers. Exemplo: um par de Reis vence um par de Damas; com o mesmo par, compare o maior kicker, depois o seguinte.</p></div><div class="ci"><strong>REGRAS DE DESEMPATE</strong><p>Na Sequência e no Straight Flush, vence a sequência mais alta. Na Quadra, vence a quadra maior. No Full House, compare primeiro a trinca. No Flush e na Carta Alta, compare as cartas da maior para a menor. Em Dois Pares, compare o par mais alto, o segundo par e depois o kicker.</p></div><div class="ci"><strong>EMPATE REAL</strong><p>Se as melhores 5 cartas forem exatamente iguais, o pote é dividido. No poker padrão, o naipe não é usado para desempatar.</p></div></div></div></section>`;if(p)push({type:'lesson',stage:k,index:i})}
function lesson(k,i,p=0){nav(true);if(k==='fundamentos'&&i===0)return ranking(k,i,p);let s=D[k],x=s.i[i],blocks=L[x[0]]||[['CONTEÚDO','Conteúdo em desenvolvimento dentro do novo front.']];root.innerHTML=`<section class="screen"><div class="card lesson"><span class="badge">${s.e} · ${String(i+1).padStart(2,'0')}</span><h2>${esc(x[0])}</h2><p class="lead">${esc(x[1])}</p><div class="blocks">${blocks.map(b=>`<div class="block"><h3>${esc(b[0])}</h3><p>${esc(b[1])}</p></div>`).join('')}</div></div></section>`;if(p)push({type:'lesson',stage:k,index:i})}
